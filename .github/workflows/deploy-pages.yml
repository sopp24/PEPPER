name: Deploy PEPPER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PEPPER JavaScript
        run: node --check app.js

      - name: Validate Netlify functions
        run: |
          node --check netlify/functions/transport-status.mjs
          node --check netlify/functions/jalap.mjs
          node --check netlify/functions/jalap-dev.mjs
          node --check lib/vercel-bridge.mjs
          node --check api/jalap.mjs
          node --check api/jalap-dev.mjs
          node --check api/transport-status.mjs
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"

      - name: Validate service worker
        run: node --check service-worker.js

      - name: Run transport connector tests
        run: node --test tests/*.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
